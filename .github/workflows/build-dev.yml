name: build-dev

# Dev channel: weekly build off the freshest vLLM dev state (day-0 lever for
# new models). The default ref is NOT main: a discover step resolves the
# newest pre-release/dev tag (vX.Y.ZrcN / vX.Y.ZdevN, e.g. v0.28.1rc0).
# Manual dispatch can override with any ref: tag, branch, full SHA or
# pull/<N>/head. NOTE: pull heads move with every push to the PR - pin by
# full SHA for reproducible builds (per-model pins live in
# models/registry.yaml `vllm_ref`). The optional `model` input appends an
# image tag suffix (:dev-<model>) so model-specific builds don't clobber the
# generic :dev tag. Builds :dev[+suffix] and a dated tag dev-YYYYMMDD.
# With RCCL_IMPL=custom the known-good librccl for gfx1151 (built by
# build-rccl.yml, release tag 'rccl-gfx1151') is fetched into
# patches/librccl/ for the Dockerfile to pick up; on failure we fall back to
# stock RCCL with a loud warning instead of failing the build.

on:
  schedule:
    - cron: "41 3 * * 0"   # Sundays 03:41 UTC
  workflow_dispatch:
    inputs:
      vllm_ref:
        description: "vLLM ref: tag, branch, full SHA or pull/<N>/head. Empty = newest dev tag (auto-discovered)."
        default: ""
        required: false
      model:
        description: "Registry model name for a model-specific build; adds image tag suffix :dev-<model>."
        default: ""
        required: false
      rccl_impl:
        description: "RCCL implementation"
        type: choice
        options:
          - custom
          - stock
        default: custom
      rocm_index:
        description: "PEP 503 index for the torch/ROCm SDK wheels. Default = TheRock multi-arch (7.x). ROCm 10.0: https://stable.repo.amd.com/rocm/whl-next"
        default: "https://repo.amd.com/rocm/whl-multi-arch"
        required: false
      tag_suffix:
        description: "Extra image-tag suffix (e.g. rocm10) so the build never moves :dev / :dev-<model>."
        default: ""
        required: false

permissions:
  contents: read
  packages: write   # ghcr.io push

concurrency:
  group: build-dev
  cancel-in-progress: false   # never cancel mid-push

env:
  IMAGE_NAME: strix-vllm-gfx1151

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Scheduled runs have no inputs -> fall back to the defaults.
      RCCL_IMPL: ${{ inputs.rccl_impl || 'custom' }}
      MODEL: ${{ inputs.model || '' }}
      ROCM_INDEX: ${{ inputs.rocm_index || 'https://repo.amd.com/rocm/whl-multi-arch' }}
      EXTRA_SUFFIX: ${{ inputs.tag_suffix || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve vLLM ref
        id: ref
        run: |
          set -euo pipefail
          ref="${{ inputs.vllm_ref || '' }}"
          if [ -z "$ref" ]; then
            # Dev channel tracks the freshest vLLM dev/PR state, not main:
            # pick the newest pre-release/dev tag. Annotated-tag deref lines
            # (^{}) never match the trailing-$ pattern.
            ref=$(git ls-remote --tags https://github.com/vllm-project/vllm.git \
              | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(rc|dev)[0-9.]*$' \
              | sed 's#refs/tags/##' | sort -Vu | tail -1)
            [ -n "$ref" ] || { echo "::error::no vLLM dev/rc tag found upstream"; exit 1; }
          fi
          echo "resolved vllm_ref=$ref"
          echo "vllm_ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Verify the ref is fetchable
        run: |
          set -euo pipefail
          # Same fetch semantics as docker/Dockerfile.fedora:
          # `git fetch --depth 1 origin <ref>` works for tags, branches, full
          # SHAs (GitHub allows reachable-SHA wants) and pull/<N>/head refs.
          # Fail fast here instead of 20 minutes into the Docker build.
          git init -q vllm-probe && cd vllm-probe
          git remote add origin https://github.com/vllm-project/vllm.git
          git fetch -q --depth 1 origin "${{ steps.ref.outputs.vllm_ref }}"
          echo "fetch ok: $(git rev-parse FETCH_HEAD)"

      - name: Resolve newest aligned gfx1151 stack
        id: stack
        run: |
          set -euo pipefail
          BASE="${ROCM_INDEX%/}"
          echo "index: $BASE"
          # Same discovery as build-stable.yml; keep both in sync.
          # whl-multi-arch is a PEP 503-style index: generic torch wheels under
          # $BASE/torch/ plus per-device plugin wheels under
          # $BASE/amd-torch-device-gfx1151/. An "aligned gfx1151 stack" is a
          # (torch, rocm) version pair present in BOTH listings. Only pairs
          # with a cp312 wheel in BOTH listings are eligible (the image runs
          # Fedora's python3.12; torch 2.13.0+rocm7.14.0 is cp312-only).
          list_t=$(curl -fsSL "$BASE/torch/" | sed 's/%2B/+/g')
          list_d=$(curl -fsSL "$BASE/amd-torch-device-gfx1151/" | sed 's/%2B/+/g')
          pairs_t=$(printf '%s' "$list_t" \
            | grep -oE 'torch-[0-9]+\.[0-9]+\.[0-9]+\+rocm[0-9]+(\.[0-9]+)+-cp312-cp312-linux_x86_64' \
            | sed -E 's/^torch-([0-9.]+)\+rocm([0-9.]+)-.*/\1 \2/' | sort -u)
          pairs_d=$(printf '%s' "$list_d" \
            | grep -oE 'amd_torch_device_gfx1151-[0-9]+\.[0-9]+\.[0-9]+\+rocm[0-9]+(\.[0-9]+)+-cp312-cp312-linux_x86_64' \
            | sed -E 's/^amd_torch_device_gfx1151-([0-9.]+)\+rocm([0-9.]+)-.*/\1 \2/' | sort -u)
          best=$(comm -12 <(printf '%s\n' "$pairs_t" | sort) <(printf '%s\n' "$pairs_d" | sort) \
            | sort -k1,1V -k2,2V | tail -1)
          [ -n "$best" ] || { echo "::error::no aligned gfx1151 torch stack (cp312) found under $BASE"; exit 1; }
          torch_version=$(printf '%s' "$best" | cut -d' ' -f1)
          rocm_version=$(printf '%s' "$best" | cut -d' ' -f2)
          # torchvision aligned the same way (both listings, this rocm, cp312).
          pairs_v=$(curl -fsSL "$BASE/torchvision/" | sed 's/%2B/+/g' \
            | grep -oE "torchvision-[0-9]+\\.[0-9]+\\.[0-9]+\\+rocm${rocm_version}-cp312-cp312-linux_x86_64" \
            | sed -E 's/^torchvision-([0-9.]+)\+.*/\1/' | sort -u)
          pairs_vd=$(curl -fsSL "$BASE/amd-torchvision-device-gfx1151/" | sed 's/%2B/+/g' \
            | grep -oE "amd_torchvision_device_gfx1151-[0-9]+\\.[0-9]+\\.[0-9]+\\+rocm${rocm_version}-cp312-cp312-linux_x86_64" \
            | sed -E 's/^amd_torchvision_device_gfx1151-([0-9.]+)\+.*/\1/' | sort -u)
          torchvision_version=$(comm -12 <(printf '%s\n' "$pairs_v" | sort) <(printf '%s\n' "$pairs_vd" | sort) \
            | sort -V | tail -1)
          [ -n "$torchvision_version" ] || { echo "::error::no aligned gfx1151 torchvision for rocm $rocm_version"; exit 1; }
          echo "resolved: ROCm=$rocm_version torch=$torch_version torchvision=$torchvision_version"
          {
            echo "rocm_version=$rocm_version"
            echo "torch_version=$torch_version"
            echo "torchvision_version=$torchvision_version"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch custom librccl for gfx1151 (RCCL_IMPL=custom)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ "$RCCL_IMPL" != "custom" ]; then
            echo "RCCL_IMPL=$RCCL_IMPL - skipping custom librccl fetch"
            exit 0
          fi
          mkdir -p patches/librccl
          # Asset is published by build-rccl.yml on the fixed tag 'rccl-gfx1151'.
          # The Dockerfile is expected to consume patches/librccl/librccl-gfx1151.so
          # when RCCL_IMPL=custom.
          if gh release download rccl-gfx1151 -p 'librccl-gfx1151.so' -D patches/librccl --clobber; then
            ls -l patches/librccl/librccl-gfx1151.so
          else
            echo "::warning title=RCCL fallback::custom librccl-gfx1151.so not available (release 'rccl-gfx1151' missing?) - building with RCCL_IMPL=stock instead"
            echo "RCCL_IMPL=stock" >> "$GITHUB_ENV"
          fi

      - name: Image tag suffix + dated tag
        run: |
          set -euo pipefail
          # Sanitize the optional model name into a docker-tag-safe suffix.
          model=$(printf '%s' "$MODEL" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-' | sed 's/^-*//; s/-*$//')
          suffix=""; [ -n "$model" ] && suffix="-$model"
          extra=$(printf '%s' "$EXTRA_SUFFIX" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-' | sed 's/^-*//; s/-*$//')
          [ -n "$extra" ] && suffix="${suffix}-${extra}"
          echo "TAG_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "DATED_TAG=dev-$(date -u +%Y%m%d)${suffix}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image ref (ghcr.io requires lowercase)
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.fedora
          load: true
          tags: ${{ env.IMAGE }}:${{ env.DATED_TAG }}
          build-args: |
            ROCM_VERSION=${{ steps.stack.outputs.rocm_version }}
            TORCH_VERSION=${{ steps.stack.outputs.torch_version }}
            TORCHVISION_VERSION=${{ steps.stack.outputs.torchvision_version }}
            VLLM_REF=${{ steps.ref.outputs.vllm_ref }}
            RCCL_IMPL=${{ env.RCCL_IMPL }}
            ROCM_INDEX_URL=${{ env.ROCM_INDEX }}/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test inside the built image
        # CI runners have no GPU: docker/smoke_test.sh must pass CPU-only.
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}/docker/smoke_test.sh:/smoke_test.sh:ro"
          "${IMAGE}:${{ env.DATED_TAG }}"
          bash /smoke_test.sh

      - name: Push :dev + dated tag (only after green smoke test)
        # Plain docker push of the already-built image (see build-stable.yml:
        # re-running the full build with push:true wastes ~45 min when the
        # gha cache loses blobs).
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:${{ env.DATED_TAG }}" "${IMAGE}:dev${{ env.TAG_SUFFIX }}"
          docker push "${IMAGE}:${{ env.DATED_TAG }}"
          docker push "${IMAGE}:dev${{ env.TAG_SUFFIX }}"
