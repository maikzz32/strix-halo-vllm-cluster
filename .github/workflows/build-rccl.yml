name: build-rccl

# OPTIONAL FALLBACK - probably not needed anymore.
#
# ROCm/rocm-systems#5229 (RCCL broken on gfx1151 in TheRock builds) is CLOSED:
# ROCm/TheRock#4935 re-enabled RCCL for gfx1151/gfx1201 and ROCm/TheRock#5376
# added librccl.so back to the python wheels. The stock librccl.so that ships
# in the rocm-sdk-libraries wheel (installed by docker/Dockerfile.fedora from
# repo.amd.com/rocm/whl-multi-arch) is therefore expected to work on gfx1151,
# and build-stable.yml builds with RCCL_IMPL=stock.
#
# This workflow remains as an escape hatch: it builds the custom RCCL from
# kyuz0/rocm-systems (branch gfx1151-rccl) inside a fedora:44 container
# against the TheRock pip ROCm SDK (Fedora 44's packaged ROCm is 7.1.x and
# lacks the gfx1151 toolchain; rocm-hip-sdk no longer exists there).
# Publishes librccl.so as a workflow artifact AND as release asset
# 'librccl-gfx1151.so' on the fixed tag 'rccl-gfx1151', which
# docker/Dockerfile.fedora consumes when RCCL_IMPL=custom.
# Manual-only: rebuild if stock RCCL misbehaves on the cluster.

on:
  workflow_dispatch:
    inputs:
      rocm_version:
        description: ROCm SDK version to build against (TheRock pip wheels)
        required: true
        default: "7.14.0"

permissions:
  contents: write   # gh release create/upload

concurrency:
  group: build-rccl
  cancel-in-progress: false

env:
  RELEASE_TAG: rccl-gfx1151
  ASSET_NAME: librccl-gfx1151.so

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      ROCM_VERSION: ${{ inputs.rocm_version }}
      ROCM_INDEX_URL: https://repo.amd.com/rocm/whl-multi-arch/
    steps:
      - name: Install build toolchain + TheRock ROCm SDK (pip)
        run: |
          set -euo pipefail
          # Toolchain + python 3.12 (Fedora 44's default python3 is 3.14; the
          # gfx1151 torch stack is cp312-only, so the SDK is installed for
          # 3.12 to match the image). No Fedora ROCm packages exist for this.
          dnf install -y --setopt=install_weak_deps=False \
            git cmake make gcc-c++ patch python3.12 python3.12-devel curl-minimal \
            numactl-libs libdrm libdrm-devel libatomic
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          python3.12 /tmp/get-pip.py --no-cache-dir
          rm -f /tmp/get-pip.py
          # hipcc and friends have /usr/bin/env python3 shebangs.
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3
          python3.12 -m pip install \
            --index-url "${ROCM_INDEX_URL}" \
            --extra-index-url https://pypi.org/simple \
            "rocm[devel,libraries,device-gfx1151]==${ROCM_VERSION}"
          python3.12 -m rocm_sdk init
          ROCM_ROOT="$(python3.12 -m rocm_sdk path --root)"
          SDK_LIBS="$(python3.12 -c 'import _rocm_sdk_libraries, pathlib; print(pathlib.Path(_rocm_sdk_libraries.__file__).parent)')"
          SDK_CORE="$(python3.12 -c 'import _rocm_sdk_core, pathlib; print(pathlib.Path(_rocm_sdk_core.__file__).parent)')"
          {
            echo "ROCM_PATH=${ROCM_ROOT}"
            echo "ROCM_HOME=${ROCM_ROOT}"
            echo "HIP_PATH=${ROCM_ROOT}"
            echo "LD_LIBRARY_PATH=${ROCM_ROOT}/lib:${SDK_CORE}/lib:${SDK_LIBS}/lib"
            echo "PATH=${ROCM_ROOT}/bin:${SDK_CORE}/bin:${PATH}"
            echo "CMAKE_PREFIX_PATH=${ROCM_ROOT}/lib/cmake"
          } >> "$GITHUB_ENV"
          # (pipefail + head -> SIGPIPE/141 on hipcc's multi-line output;
          # `|| true` keeps this informational line non-fatal)
          "${ROCM_PATH}/bin/hipcc" --version 2>&1 | head -1 || true

      - name: Probe hipcc on the GPU-less runner + install arch-injecting wrapper
        run: |
          set -uo pipefail
          # RCCL requires CMAKE_CXX_COMPILER to end in "hipcc"; its nested
          # fmt/FetchContent configures don't inherit -DCMAKE_REQUIRED_FLAGS,
          # so arch probing must ride along with the compiler itself. Wrap
          # hipcc so EVERY invocation (incl. nested try_compiles) gets
          # --offload-arch=gfx1151. The probe output documents the actual
          # failure mode in the run log.
          echo 'int main(){return 0;}' > /tmp/probe.cpp
          echo "--- hipcc without --offload-arch:"
          "${ROCM_PATH}/bin/hipcc" /tmp/probe.cpp -o /tmp/probe1 2>&1 | head -5
          echo "--- hipcc --offload-arch=gfx1151 (expected to pass):"
          "${ROCM_PATH}/bin/hipcc" --offload-arch=gfx1151 /tmp/probe.cpp -o /tmp/probe2 2>&1 | head -5 \
            && echo "arch-pinned hipcc compile OK"
          mkdir -p /opt/hipcc-wrap
          printf '#!/bin/sh\nexec "%s/bin/hipcc" --offload-arch=gfx1151 "$@"\n' \
            "${ROCM_PATH}" > /opt/hipcc-wrap/hipcc
          chmod +x /opt/hipcc-wrap/hipcc
          /opt/hipcc-wrap/hipcc /tmp/probe.cpp -o /tmp/probe3 \
            && echo "wrapper compile OK"

      - name: Clone and build RCCL for gfx1151
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gfx1151-rccl https://github.com/kyuz0/rocm-systems.git
          # RCCL lives in projects/rccl inside the rocm-systems monorepo.
          cd rocm-systems/projects/rccl
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/opt/hipcc-wrap/hipcc \
            -DROCM_PATH="${ROCM_PATH}" \
            -DCMAKE_PREFIX_PATH="${ROCM_PATH}/lib/cmake" \
            -DGPU_TARGETS=gfx1151 \
            -DBUILD_TESTS=OFF
          cmake --build build -j"$(nproc)"

      - name: Collect librccl.so
        run: |
          set -euo pipefail
          # Take the real shared object (not a symlink), newest versioned name.
          so=$(find rocm-systems/projects/rccl/build -type f -name 'librccl.so*' | sort -V | tail -1)
          [ -n "$so" ] || { echo "::error::librccl.so not found in build tree"; exit 1; }
          mkdir -p out
          cp -L "$so" "out/${ASSET_NAME}"
          ls -l out/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: librccl-gfx1151
          path: out/${{ env.ASSET_NAME }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: librccl-gfx1151

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh needs a repo context for release commands; the job has no
          # checkout, so point it at the repository explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Create the fixed release once; subsequent runs just re-upload.
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "Custom RCCL for gfx1151 (fallback)" \
              --notes "librccl.so built from kyuz0/rocm-systems@gfx1151-rccl in a fedora:44 container against the TheRock pip ROCm SDK (workflow build-rccl.yml). Fallback only: stock RCCL from the rocm-sdk-libraries wheel is expected to work since ROCm/rocm-systems#5229 was fixed. Consumed by docker/Dockerfile.fedora when RCCL_IMPL=custom."
          gh release upload "$RELEASE_TAG" "${ASSET_NAME}#${ASSET_NAME}" --clobber
          echo "published: $(gh release view "$RELEASE_TAG" --json url -q .url)"
