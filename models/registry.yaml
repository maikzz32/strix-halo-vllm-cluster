# Model registry — single source of truth for scripts/serve.sh, bench/run_matrix.py
# and .github/workflows/model-watch.yml.
#
# Schema per model entry:
#   hf_repo            Hugging Face repo id
#   dtype              weight dtype/quant used for serving (bf16 | awq | mxfp4 | fp8)
#   approx_size_gib    approximate weights size, for placement planning
#   context:           native_tokens, yarn_factor (optional), yarn_tokens (optional)
#   status             supported | dev | blocked
#                        supported = works on a stable-channel image
#                        dev       = needs :dev image (vLLM main / PR / special build)
#                        blocked   = upstream support missing, tracked in `tracking`
#   tracking           list of upstream URLs (PRs/issues) that gate this model
#   vllm_ref           optional: full SHA of the vLLM PR head this model is
#                      built from (pull heads move - pin by SHA for
#                      reproducibility). When set, model-watch tracks the
#                      source PR's current head and dispatches build-dev.yml
#                      with this ref + a `model` input when the head moves;
#                      build-dev can also be dispatched manually with it
#                      (image tag suffix :dev-<model>).
#   env                model-specific env overrides (merged over profiles.defaults.env)
#   extra_args         list of extra CLI args for `vllm serve`
#   parsers            tokenizer_mode / tool_call_parser / reasoning_parser (optional)
#   allowed_profiles   subset of profiles defined in scripts/serve.sh
#                        (tp2 | tp4 | pp4 | tp2pp2 | ep | solo); omit = all allowed
#   notes              free-form operational notes
#   references         source URLs for the facts above

defaults:
  env:
    VLLM_ROCM_USE_AITER: "0"        # AITER sampler/MoE/FP8-linear unsupported on gfx1x
    VLLM_GFX1X_MOE_TUNE: "1"        # measured 11.3 -> 21.8 tok/s decode on gfx1151 MoE
    # patch 59: skip platform probing (amdsmi is NOT in the image; stock ROCm
    # detection fails with "Failed to infer device type" without this)
    VLLM_GFX1X_FAST_PLATFORM: "1"
    # Cuts HIP allocator fragmentation on gfx1151 unified memory; proven on
    # Strix Halo cluster setups (tight KV budgets after ROCm/hip#3892 fix).
    PYTORCH_HIP_ALLOC_CONF: "expandable_segments:True,garbage_collection_threshold:0.85"
  extra_args:
    # HIP graph CAPTURE deadlocks on gfx1151 (vllm#32180), but cudagraph_mode
    # NONE only drops the capture and keeps Inductor fusion - measured win on
    # qwen38-27b-ablit/tp4: 44.3 -> 47.4 tok/s @C=1, 104.3 -> 114.2 @C=16,
    # 600 s soak without a single hang (bench/cudagraph_ab.sh, 2026-08-31).
    # Verified for this model/profile; re-verify when enabling new models.
    - --compilation-config
    - '{"cudagraph_mode":"NONE"}'

models:

  qwen38-27b-ablit:
    hf_repo: /home/maik/qwen38_ablit   # local path, present on ALL 4 nodes (same path)
    dtype: gptq-int4
    approx_size_gib: 17
    context:
      native_tokens: 262144
    status: supported
    env: {}
    extra_args:
      # APU unified memory: 0.9 (vLLM default) budgets ~111 GiB of the 124 GiB
      # GTT for GPU and OOM-kills the host; 0.8 still OOMed at engine init
      # (KV pool + weights + multimodal profiling + host python > 124 GiB
      # physical). 0.6 until gttsize (126976) is rebalanced vs host RAM.
      - --gpu-memory-utilization
      - "0.6"
      # CRITICAL: vLLM profiles activations with a dummy run of max_num_tokens
      # = max_model_len; at the native 262k context that profile run alone
      # allocates >100 GiB and OOM-kills the node (measured: spike to 124 GiB
      # in <60 s right after the encoder-cache init log). Cap the bench
      # context; raise only with a rebalanced GTT.
      - --max-model-len
      - "32768"
      # CRITICAL: preprocessor_config allows a 16.7-MP dummy image; vLLM's
      # multimodal encoder profiling OOM-killed the node with it
      # (total-vm 440 TiB reservation, global_oom, VLLM::EngineCor killed).
      # Bench is text-only -> disable vision inputs entirely.
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
      # MTP speculative decoding (mtp_num_hidden_layers present in config).
      # Same method the Toolbox-C reference values (docs/PERFORMANCE.md
      # section c) were measured with - the bar to beat.
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
    parsers:
      tool_call_parser: hermes
    notes: >
      Dense hybrid model (config model_type qwen3_5): 64 layers, hidden 5120,
      GQA 24/4, vocab 248320, linear attention + full attention every 4 layers,
      MTP head present (mtp_num_hidden_layers); MTP 3 is enabled via
      extra_args above (Toolbox-C comparison config, no baseline run yet).
      GPTQ int4 pack-quantized (group 128, symmetric) -> vLLM GPTQ path on
      gfx1151 must be validated (Marlin availability on RDNA uncertain,
      Triton fallback possible). 17 GiB fits easily per node: profile solo
      is the expected winner; tp4 only as comparison. Vision weights present
      but bench is text-only (timm/opencv were cut from the image - re-add
      if vision is ever needed). First bench target of this repo.
    references: []

  qwen38-27b-ablit-dflash:
    hf_repo: /home/maik/qwen38_ablit   # local path, present on ALL 4 nodes (same path)
    dtype: gptq-int4
    approx_size_gib: 17
    context:
      native_tokens: 262144
    status: supported
    env: {}
    extra_args:
      # Same memory/context guards as qwen38-27b-ablit (APU unified memory,
      # 0.9/0.8 OOM-killed the node; 262k profile run OOMs; bench is text-only).
      - --gpu-memory-utilization
      - "0.6"
      - --max-model-len
      - "32768"
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
      # DFlash2 block-diffusion drafter (upstream via vllm PR #52816).
      # num_speculative_tokens=7 == trained block_size 8 (1 bonus query + 7
      # mask queries), the official quick-start value on the model card; the
      # draft config carries no n_predict, so it must be set explicitly.
      - --speculative-config
      - '{"method":"dflash","model":"incoai/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
    parsers:
      tool_call_parser: hermes
    notes: >
      Same target as qwen38-27b-ablit but with the DFlash2 block-diffusion
      drafter (incoai/Qwen3.8-27B-DFlash2, ~3.85 GB bf16, ungated) instead of
      the built-in MTP head. DFlash2DraftModel forces use_v2_model_runner
      (candidate selector exists only in the V2 speculator); draft attention
      needs non-causal support - ROCM_ATTN advertises supports_non_causal.
      A/B experiment vs the MTP3 entry (bench prompt-length 512, C=1/8/32).
    references:
      - https://huggingface.co/incoai/Qwen3.8-27B-DFlash2
      - https://github.com/vllm-project/vllm/pull/52816

  qwen36-35b-a3b:
    hf_repo: Qwen/Qwen3.6-35B-A3B
    dtype: bf16
    approx_size_gib: 71
    context:
      native_tokens: 262144
    status: supported
    env:
      VLLM_ATTENTION_BACKEND: ROCM_AITER_UNIFIED_ATTN
    extra_args: []
    parsers:
      tool_call_parser: hermes
      reasoning_parser: qwen3
    notes: >
      Reference model, proven on gfx1151 vLLM (kyuz0 models.py profile).
      Validate the whole chain end-to-end with this model first.
      AWQ variant exists but AWQ MoE falls back to slow MoeWNA16 kernels
      (kyuz0 issue #72) - prefer bf16.
    references:
      - https://github.com/kyuz0/amd-strix-halo-vllm-toolboxes/issues/72

  qwen38-flash-next:
    hf_repo: Qwen/Qwen3.8-Flash-Next
    dtype: bf16
    approx_size_gib: 335
    context:
      native_tokens: 262144
      yarn_factor: 4.0
      yarn_tokens: 1048576
    status: dev
    # PR vllm#53899 head (qwen4_exp model + PLE CPU offload, author-blessed
    # for builds; fork branch peakcrosser7/vllm release/qwen38next_offload).
    vllm_ref: 935728b4a95e110d91a41ab4e02b6bed06ec66ab
    tracking:
      - https://github.com/vllm-project/vllm/releases   # not in any PyPI release yet
    env:
      # activates patch 57 (PLE pinned-host offload on the AMD path); on the APU
      # the "host" table sits in the same unified memory = zero-copy gather at
      # ~256 GB/s, freeing ~13 GiB/node at TP=4 (NVIDIA path is PCIe-bound)
      VLLM_PLE_CPU_OFFLOAD: "1"
    extra_args:
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --hf-overrides
      - '{"rope_parameters":{"rope_type":"yarn","factor":4.0}}'
    allowed_profiles: [tp4, solo]   # no PP: PLE embedding table unsupported by pipeline parallel
    notes: >
      125B/6B active, 512 experts (10+1 routed), 48 layers (36 Gated DeltaNet +
      12 sparse attention, 3:1). +51B PLE n-gram embedding table - upstream
      offload is NVIDIA-only; patch 57 ports it to the AMD path (zero-copy on
      the APU). BF16 fits TP=4 across 4x ~116 GiB GTT; long context gets tight.
      FP8 pointless on RDNA 3.5 (emulated at bf16 speed). Build from the pinned
      PR head above via build-dev.yml (image tag :dev-qwen38-flash-next).
    references:
      - https://recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next
      - https://www.amd.com/en/developer/resources/technical-articles/2026/day-0-support-for-qwen-3-8-on-amd-instinct-gpus.html

  # Same model off the RELEASE TAG instead of the PR head. vllm#53896 (the
  # qwen4_exp model) is merged and contained in v0.29.0rc1; vllm#53899 (the
  # PLE offload) is NOT, so patch 57 has nothing to port and defers there.
  # The offload is replaced by vLLM's generic UVA path, which lands the table
  # in the same unified memory but WITHOUT patch 57's prefetch overlap - that
  # is the one thing this entry gives up versus qwen38-flash-next.
  # Keep both until the A/B is measured; drop this one if the overlap wins.
  qwen38-flash-next-tag:
    hf_repo: Qwen/Qwen3.8-Flash-Next
    dtype: bf16
    approx_size_gib: 335
    context:
      native_tokens: 262144
      yarn_factor: 4.0
      yarn_tokens: 1048576
    status: dev
    # vLLM release tag, not a moving PR head: v0.29.0rc1 = 33898f832c.
    vllm_ref: 33898f832c53c3e98999e0ec2c689f61ee92a9bc
    tracking:
      - https://github.com/vllm-project/vllm/pull/53899   # PLE offload, still open
    env: {}
    extra_args:
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --hf-overrides
      - '{"rope_parameters":{"rope_type":"yarn","factor":4.0}}'
      # Generic UVA offload replaces patch 57. `ngram_embedding` is the AMD
      # parameter segment (qwen4_exp/amd/ple_layer.py); matching is by exact
      # name segment. The budget is a starting value derived from patch 57's
      # "~13 GiB/node at TP=4" - UNMEASURED on this path, raise it if the
      # table does not fit and lower it once the real figure is known.
      - --cpu-offload-gb
      - "16"
      - --cpu-offload-params
      - ngram_embedding
    allowed_profiles: [tp4, solo]   # no PP: hard NotImplementedError when ple_layer_ids and PP>1
    notes: >
      Tag-based twin of qwen38-flash-next. Registry entries in v0.29.0rc1:
      Qwen4ExpForCausalLM / Qwen4ExpForConditionalGeneration / Qwen4ExpMTP,
      ROCm dispatch to qwen4_exp/amd without any arch gate and with zero AITER
      calls. FP8 is not merely slow but blocked on gfx1151: supports_fp8() is
      on_cdna() or on_rdna4(), and with no FP8 MoE backend left the oracle
      raises - so BF16 stays the only option here. First run must confirm that
      --cpu-offload-params actually matches ngram_embedding and that the UVA
      backend engages; if it does not, fall back to qwen38-flash-next.
    references:
      - https://recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next
      - https://github.com/vllm-project/vllm/pull/53896   # merged 2026-08-31

  # The INT4 re-quant that already sits on all four nodes and produced the
  # 28.4 tok/s single-stream figure in the old FLASHNEXT notes. Same weights,
  # now served off the RELEASE TAG instead of a PR head - that is the A/B.
  # Measured from the checkpoint (2026-09-02): compressed-tensors
  # pack-quantized, 4 bit, group 32, ASYMMETRIC (73,728 weight_zero_point
  # tensors). The 51 B n-gram table and the whole vision tower are in the
  # quantization ignore list, i.e. they stay BF16 - which is why 176 GiB and
  # not ~70. Asymmetric MoE is fine here: the "Only symmetric quantization is
  # supported for MoE" assert lives in the flydsl and W4A8 paths, while
  # compressed_tensors_moe_wna16.py handles zero points explicitly.
  # This checkpoint is the STOCK Qwen quantization, i.e. NOT decensored.
  qwen38-flash-next-int4:
    hf_repo: /home/maik/qwen38_flashnext   # local INT4 re-quant, present on ALL 4 nodes
    dtype: gptq-int4
    approx_size_gib: 176
    context:
      native_tokens: 262144
    status: dev
    # vLLM release tag v0.29.0rc1 (contains vllm#53896, the merged qwen4_exp model).
    vllm_ref: 33898f832c53c3e98999e0ec2c689f61ee92a9bc
    tracking:
      - https://github.com/vllm-project/vllm/pull/53899   # PLE offload, still open
    env: {}
    extra_args:
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      # Vision tower is present in this checkpoint (BF16, in the ignore list).
      # The multimodal encoder profiler allocated a 16.7 MP dummy image and
      # OOM-killed a node on qwen38-27b-ablit; the bench is text-only anyway.
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
      # vLLM profiles activations with a dummy run of max_num_tokens =
      # max_model_len; at the native 262k that run alone OOM-killed a node.
      # Raise deliberately, with the GTT budget rechecked.
      - --max-model-len
      - "32768"
      # 0.9 (the vLLM default) budgets ~111 of the 124 GiB GTT and killed the
      # host on multi-node bring-up. Measured 2026-09-02: at TP4 0.8 is ample;
      # at TP2 (89.9 GiB weights/rank) 0.8 leaves NO KV cache (-2.4 GiB) and
      # 0.85 leaves 3.02 GiB - enough for the c=1 bench only. TP2 measured
      # 18.09 vs 23.06 tok/s at TP4 (same bench), kept in allowed_profiles for
      # experiments, not for serving.
      - --gpu-memory-utilization
      - "0.85"
    allowed_profiles: [tp4, tp2, solo]   # no PP: hard NotImplementedError when ple_layer_ids and PP>1
    notes: >
      Serves the existing local INT4 weights on the v0.29.0rc1 image. Point of
      the run: compare against the 28.4 tok/s the same weights reached on the
      PR-head build, and exercise the ROCm W4A16 zero-point transpose fix
      (vllm#48998, in this tag) which decides transposition from output_dim
      instead of guessing from tensor shape - this checkpoint is asymmetric,
      so it takes that path. Roughly 3.4x fewer bytes per token than the BF16
      checkpoints (~4.65 effective bits/weight vs 16), so BF16 is the slower
      option here, not the faster one.
    references:
      - https://github.com/vllm-project/vllm/pull/48998

  glm53-flash:
    hf_repo: /home/maik/glm53_flash   # local int4 re-quant, present on ALL 4 nodes
    dtype: gptq-int4                  # compressed-tensors pack-quantized 4-bit group 32
    approx_size_gib: 199
    context:
      native_tokens: 1048576
    status: dev
    # PR vllm#53906 head (glm5_next support; ROCm officially gfx950-gated,
    # needs FlashInfer>=0.6.18; fork branch ZJY0516/vllm glm-release).
    vllm_ref: 36bb3795b258e1b773cee5c2b725d9b8346b0c8d
    tracking:
      - https://github.com/vllm-project/vllm/pull/53906   # extends beyond gfx950 to MI300/325
      - https://github.com/ggml-org/llama.cpp/pull/27773  # llama.cpp glm5_next PR (fallback path)
    env:
      VLLM_ATTENTION_BACKEND: ROCM_AITER_MLA_SPARSE       # validate on gfx1151 once unblocked
      # patch 58: force the Triton sparse-MLA lane (asm/Gluon lanes are
      # gfx950-only, unreachable on gfx1151) + geometry-keyed MTP dispatch fix
      VLLM_GFX1X_FORCE_TRITON_SPARSE: "1"
      # Triton hot-path lane for the kpool indexer (runtime patch
      # runtime_glm53_kpool_triton.py, layered on torch lane v1.5).
      # "0" falls back to the pure torch lane.
      VLLM_GFX1X_KPOOL_TRITON: "1"
    extra_args:
      # APU unified memory: weights ~50 GiB/node at tp4; 0.6 leaves room for
      # KV + activations + host python without OOM-killing the node (same
      # hard-learned lesson as qwen38-27b-ablit).
      - --gpu-memory-utilization
      - "0.6"
      # 1M native context makes the engine-init profile run alone allocate
      # >100 GiB. Cap the bench context; raise only with a rebalanced GTT.
      - --max-model-len
      - "32768"
    notes: >
      320B/18B active, 45 layers (34 KDA linear + 11 sparse-MLA), 288 experts (8+1),
      1M context, MIT license. Local checkpoint is a compressed-tensors
      pack-quantized int4 re-quant (group 32, 199 GB) instead of the FP8
      upstream weights (FP8 is emulated at BF16 speed on RDNA 3.5).
      RUNS on gfx1151 since 2026-09-01 (tp4, dev image dev-glm53-flash):
      patch 58 (Triton sparse-MLA lane) + patch 61 (AWQ name remap +
      int4 dequant of the BF16-built KDA/MLA projections) + kpool indexer
      lanes: torch v1.5 (runtime_glm53_kpool_torch.py, batched-head logits)
      + Triton hot paths (runtime_glm53_kpool_triton.py, gate
      VLLM_GFX1X_KPOOL_TRITON above) + z3-solver/libz3 (Dockerfile).
      Numbers (prompt 512): 9.9/20.7/48.2 tok/s aggregate at C=1/8/32 -
      the indexer share is tiny at short context; the Triton lane pays off
      at 8k+ contexts (standalone up to 38x on decode logits vs torch v1.4).
      With MTP see glm53-flash-mtp (14.1/61.5/102.5). Quality caveat:
      G1 greedy short prompts show repetition (int4 requant behavior;
      needle test at 4.5k context passes, short-form answers coherent).
      None of the runtime patches are baked into the image yet - a
      container rebuild needs them re-applied.
    references:
      - https://huggingface.co/zai-org/GLM-5.3-Flash
      - https://recipes.vllm.ai/zai-org/GLM-5.3-Flash

  glm53-flash-mtp:
    hf_repo: /home/maik/glm53_flash   # local int4 re-quant, present on ALL 4 nodes
    dtype: gptq-int4                  # compressed-tensors pack-quantized 4-bit group 32
    approx_size_gib: 199
    context:
      native_tokens: 1048576
    status: dev
    # Same pinned PR vllm#53906 head as glm53-flash (glm5_next support).
    vllm_ref: 36bb3795b258e1b773cee5c2b725d9b8346b0c8d
    tracking:
      - https://github.com/vllm-project/vllm/pull/53906
      - https://github.com/vllm-project/vllm/issues/53943   # ROCm MTP gaps upstream
    env:
      VLLM_ATTENTION_BACKEND: ROCM_AITER_MLA_SPARSE
      # patch 58: geometry-keyed MTP dispatch covers draft/verify shapes
      # (NoPE checkpoint: head_size == kv_lora_rank == 512)
      VLLM_GFX1X_FORCE_TRITON_SPARSE: "1"
      VLLM_GFX1X_KPOOL_TRITON: "1"
    extra_args:
      - --gpu-memory-utilization
      - "0.6"          # watch: +~4.5 GiB/rank BF16 draft weights + draft KV groups
      - --max-model-len
      - "32768"
      # MTP head = layer 45 (BF16 in the local requant); 1 MTP layer recycled
      # per draft step; 5 = official recipe value - WINS the A/B against 3
      # (2026-09-01: 14.1/61.5/102.5 vs 11.6/44.3/100.4 tok/s agg @C=1/8/32).
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":5}'
    notes: >
      glm53-flash plus the built-in MTP draft head. REQUIRES patch 62
      (patches/62_glm53_mtp_draft_bf16.py: the draft must not inherit the
      compressed-tensors int4 method - layer 45 experts/shared-MLP/head are
      BF16 in the local requant; do NOT use with the upstream FP8 checkpoint).
      Draft/verify shapes ride the ragged Triton sparse-MLA lane (patch 58)
      and the kpool indexer lanes (torch v1.5 / Triton, both spec-aware).
      Verify acceptance via vllm:spec_decode_num_* counters (G3).
    references:
      - https://recipes.vllm.ai/zai-org/GLM-5.3-Flash
      - https://huggingface.co/zai-org/GLM-5.3-Flash
